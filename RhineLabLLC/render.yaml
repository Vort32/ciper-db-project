services:
  - type: web
    name: rhine-lab-app
    runtime: docker
    plan: free
    buildCommand: "composer install --no-dev --optimize-autoloader && npm install && npm run build && php artisan config:cache && php artisan route:cache"
    startCommand: "apache2-foreground"
    envVars:
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: "stderr"